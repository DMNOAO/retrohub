name: Fix Gen III Pokedex once
on:
  push:
    branches: [agent/fix-gen3-pokedex-species-mapping]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-gen3-pokedex-species-mapping
      - uses: dart-lang/setup-dart@v1
      - name: Correct species mapping in generator
        shell: python
        run: |
          from pathlib import Path
          p = Path('tool/generate_gen3_pokedex.dart')
          s = p.read_text()
          s = s.replace("final species = _nationalSpeciesIds(\n      File('${emerald.path}/include/constants/species.h'),\n    );", "final species = _nationalSpeciesIds(\n      File('${emerald.path}/include/constants/pokedex.h'),\n    );")
          start = s.index('Map<String, int> _nationalSpeciesIds(File file) {')
          end = s.index('\nMap<String, String> _moveNames', start)
          replacement = r'''Map<String, int> _nationalSpeciesIds(File file) {
  final out = <String, int>{};
  var nationalId = -1;
  var inNationalEnum = false;

  for (final rawLine in file.readAsLinesSync()) {
    final line = rawLine.trim();
    if (line == '// National Pokédex order') {
      inNationalEnum = true;
      continue;
    }
    if (!inNationalEnum) continue;
    if (line == '};') break;

    final match = RegExp(r'^NATIONAL_DEX_([A-Z0-9_]+),?$').firstMatch(line);
    if (match == null) continue;
    nationalId++;
    final name = match.group(1)!;
    if (name == 'NONE') continue;
    if (nationalId >= 1 && nationalId <= 386) {
      out[_norm(name)] = nationalId;
    }
  }
  return out;
}
'''
          s = s[:start] + replacement + s[end:]
          s = s.replace("/// Returns SPECIES name -> National Dex ID.\n///\n/// pokeemerald uses the original Gen III internal species table:\n///   1..251   = Kanto + Johto (same as National Dex)\n///   252..276 = OLD_UNOWN_B .. OLD_UNOWN_Z (not National species)\n///   277..411 = Treecko .. Chimecho\n///\n/// Therefore every real Hoenn species is internalId - 25. For example:\n/// Treecko 277 -> #252, Mudkip 283 -> #258, Chimecho 411 -> #386.\n", "/// Returns species name -> real National Dex ID by parsing the canonical\n/// NATIONAL_DEX_* enum. The Gen III internal SPECIES_* order is different\n/// from National Dex order throughout Hoenn, so arithmetic offsets are invalid.\n")
          p.write_text(s)
      - name: Regenerate and localize datasets
        run: |
          dart run tool/generate_gen3_pokedex.dart
          dart run tool/localize_gen3_pokedex_es.dart
      - name: Sanity checks
        run: |
          grep -A16 "  276: PokedexSpeciesDetail" lib/features/journal/data/emerald_pokedex_generated.dart | grep -q "Picotazo"
          grep -A16 "  280: PokedexSpeciesDetail" lib/features/journal/data/emerald_pokedex_generated.dart | grep -q "Confusión"
          grep -A16 "  287: PokedexSpeciesDetail" lib/features/journal/data/emerald_pokedex_generated.dart | grep -q "Arañazo"
      - name: Commit corrected datasets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tool/generate_gen3_pokedex.dart lib/features/journal/data/ruby_pokedex_generated.dart lib/features/journal/data/sapphire_pokedex_generated.dart lib/features/journal/data/emerald_pokedex_generated.dart
          git commit -m "fix: map Gen III species to real National Dex IDs"
          git push
