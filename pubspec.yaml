name: retrohub
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  file_picker: 10.3.10
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  uuid: ^4.5.1
  ffi: ^2.1.4
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4
  
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/retrohub_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/covers/gb/
    - assets/covers/gbc/
    - assets/covers/gba/
    - assets/covers/snes/

    - assets/frames/gb/
    - assets/frames/gbc/

    - assets/sprites/pokemon/gb/red_blue/
    - assets/sprites/pokemon/gb/yellow/

    - assets/sprites/pokemon/gbc/crystal/
    - assets/sprites/pokemon/gbc/crystal/shiny/
    - assets/sprites/pokemon/gbc/gold/
    - assets/sprites/pokemon/gbc/gold/shiny/
    - assets/sprites/pokemon/gbc/silver/
    - assets/sprites/pokemon/gbc/silver/shiny/

    - assets/sprites/pokemon/gba/emerald/
    - assets/sprites/pokemon/gba/emerald/shiny/
    - assets/sprites/pokemon/gba/fire_red_leaf_green/
    - assets/sprites/pokemon/gba/fire_red_leaf_green/shiny/
    - assets/sprites/pokemon/gba/ruby_sapphire/
    - assets/sprites/pokemon/gba/ruby_sapphire/shiny/
    - assets/sprites/badges/Kanto/
    - assets/sprites/badges/Johto/
    - assets/sprites/badges/Hoenn/

    - assets/sprites/characters/protagonists/
    - assets/sprites/characters/rivals/
    - assets/sprites/characters/champions/
    - assets/sprites/characters/gym_leaders/gb/
    - assets/sprites/characters/gym_leaders/gbc/
